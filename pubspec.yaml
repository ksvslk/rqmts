name: prioritize_requirements
description: "A cozy and friendly app to help you prioritize your tasks and requirements, one bubble at a time."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5 # <-- ADD THIS

  # UI & Design
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0

  # Functionality
  share_plus: ^11.0.0
  uuid: ^4.5.1

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Persistence Build Tools
  hive_generator: ^2.0.1
  build_runner: ^2.5.4

   # Riverpod Build Tool
  riverpod_generator: ^2.4.2 # <-- ADD THIS

# This section tells Flutter about your project's assets, fonts, etc.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/